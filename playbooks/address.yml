---
- name: Manage FortiGate address
  hosts: fortigates
  gather_facts: false
  connection: httpapi

  vars:
    vdom: "root"
    fortios_access_token: "{{ fortigate_token }}"
    # Ensure fortios_access_token and fortigate_addresses are defined
    # in your inventory, vault, or extra-vars.

  tasks:
    - name: Debug All Variables
      ansible.builtin.debug:
        msg: "Available vars: {{ vars.keys() | list }}"

    - name: Debug token length (safe)
      ansible.builtin.debug:
        msg: "FORTIOS token length={{ fortios_access_token | length }}"

    - name: Debug address config
      ansible.builtin.debug:
        var: fortigate_addresses

    - name: Show each address before applying
      ansible.builtin.debug:
        msg: "Preparing to manage {{ item.name }} (type: {{ item.type | default('ipmask') }})"
      loop: "{{ fortigate_addresses }}"
      loop_control:
        label: "{{ item.name }}"

    - name: Validate address type
      ansible.builtin.assert:
        that:
          - item.type is not defined or item.type in ['ipmask', 'iprange', 'fqdn', 'wildcard']
        fail_msg: "Invalid address type for {{ item.name }}"
      loop: "{{ fortigate_addresses }}"
      loop_control:
        label: "{{ item.name }}"

    - name: Manage address objects
      fortinet.fortios.fortios_firewall_address:
        vdom: "{{ vdom }}"
        access_token: "{{ fortios_access_token }}"
        state: "{{ item.state | default('present') }}"
        firewall_address:
          name: "{{ item.name }}"
          type: "{{ item.type | default('ipmask') }}"
          subnet: "{{ item.subnet | default(omit) }}"
          start_ip: "{{ item.start_ip | default(omit) }}"
          end_ip: "{{ item.end_ip | default(omit) }}"
          fqdn: "{{ item.fqdn | default(omit) }}"
          wildcard: "{{ item.wildcard | default(omit) }}"
          allow_routing: "enable"
      loop: "{{ fortigate_addresses }}"
      loop_control:
        label: "{{ item.name }}"

    - name: Fetch address objects from FortiGate to verify
      fortinet.fortios.fortios_configuration_fact:
        vdom: "{{ vdom }}"
        access_token: "{{ fortios_access_token }}"
        selector: "firewall_address"
        params:
          name: "{{ item.name }}"
      loop: "{{ fortigate_addresses }}"
      loop_control:
        label: "{{ item.name }}"
      register: verification_results

    - name: Show verification status
      ansible.builtin.debug:
        msg: >
          {% if item.meta.results.name is defined %}
          SUCCESS: Object '{{ item.item.name }}' verified on FortiGate with type '{{ item.meta.results.type }}'.
          {% else %}
          FAILED: Object '{{ item.item.name }}' was not found or could not be verified.
          {% endif %}
      loop: "{{ verification_results.results }}"
      loop_control:
        label: "{{ item.item.name }}"

    - name: Debug full item payload (Final Summary)
      ansible.builtin.debug:
        msg: >
          name={{ item.name }}
          type={{ item.type | default('ipmask') }}
          subnet={{ item.subnet | default('N/A') }}
          fqdn={{ item.fqdn | default('N/A') }}
      loop: "{{ fortigate_addresses }}"
      loop_control:
        label: "{{ item.name }}"
