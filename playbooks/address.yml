---
- name: Manage FortiGate address
  hosts: fortigates
  gather_facts: false
  connection: httpapi

  vars:
    vdom: "root"

    fortigate_addresses:
      - name: "test-address-ansible"
        type: "ipmask"
        subnet: "192.168.1.200 255.255.255.255"
        state: "present"

      - name: "range-test"
        type: "iprange"
        start_ip: "192.168.1.10"
        end_ip: "192.168.1.20"
        state: "present"

      - name: "google-test"
        type: "fqdn"
        fqdn: "google.com"
        state: "present"

  tasks:

    # ✅ Debug token safely (already good)
    - name: Debug token length (safe)
      ansible.builtin.debug:
        msg: "FORTIOS token length={{ fortios_access_token | length }}"

    # ✅ OPTIONAL but powerful: show token edges
    - name: Debug token start/end
      ansible.builtin.debug:
        msg: "Token starts={{ fortios_access_token[:5] }}... ends={{ fortios_access_token[-5:] }}"

    # ✅ NEW: Connectivity + token validation
    - name: Test FortiGate connectivity
      ansible.builtin.uri:
        url: "https://{{ ansible_host }}:20443/api/v2/cmdb/system/status"
        method: GET
        validate_certs: false
        headers:
          Authorization: "Bearer {{ fortios_access_token }}"
      register: test_result
      failed_when: test_result.status != 200

    - name: Show connectivity result
      ansible.builtin.debug:
        msg: "FortiGate reachable ✅ (HTTP {{ test_result.status }})"

    # ✅ Task 1: Create Subnet
    - name: Create Subnet Addresses
      fortinet.fortios.fortios_firewall_address:
        vdom: "{{ vdom }}"
        state: "present"
        firewall_address:
          name: "test-ansible-new-name"
          type: "ipmask"
          subnet: "192.168.1.200/255.255.255.255"

    # ✅ Task 2: Create Ranges
    - name: Create Range Addresses
      fortinet.fortios.fortios_firewall_address:
        vdom: "{{ vdom }}"
        state: "present"
        firewall_address:
          name: "{{ item.name }}"
          type: "iprange"
          start_ip: "{{ item.start_ip }}"
          end_ip: "{{ item.end_ip }}"
          associated_interface: "any"
      loop: "{{ fortigate_addresses | selectattr('type', 'equalto', 'iprange') | list }}"
      loop_control:
        label: "{{ item.name }}"

    # ✅ Task 3: Create FQDNs
    - name: Create FQDN Addresses
      fortinet.fortios.fortios_firewall_address:
        vdom: "{{ vdom }}"
        state: "present"
        firewall_address:
          name: "{{ item.name }}"
          type: "fqdn"
          fqdn: "{{ item.fqdn }}"
          associated_interface: "any"
      loop: "{{ fortigate_addresses | selectattr('type', 'equalto', 'fqdn') | list }}"
      loop_control:
        label: "{{ item.name }}"

    # ✅ Verification
    - name: Fetch address objects from FortiGate to verify
      fortinet.fortios.fortios_configuration_fact:
        vdom: "{{ vdom }}"
        selector: "firewall_address"
        params:
          name: "{{ item.name }}"
      loop: "{{ fortigate_addresses }}"
      loop_control:
        label: "{{ item.name }}"
      register: verification_results
      ignore_errors: true

    - name: Show verification status
      ansible.builtin.debug:
        msg: >
          {% if item.meta.results.name is defined or
                (item.meta.results is iterable and item.meta.results[0].name is defined) %}
          ✅ SUCCESS: Object '{{ item.item.name }}' verified on FortiGate.
          {% else %}
          ❌ FAILED: Object '{{ item.item.name }}' not found.
          {% endif %}
      loop: "{{ verification_results.results }}"
      loop_control:
        label: "{{ item.item.name }}"
